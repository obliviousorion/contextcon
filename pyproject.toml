[project]
name = "benefits-desk"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.4",
    "pytest>=9.2.0",
    "pypdf==5.1.0",
]

[project.scripts]
bd = "bd.cli:main"

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
